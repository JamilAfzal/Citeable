services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: citeable, POSTGRES_PASSWORD: citeable, POSTGRES_DB: citeable }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://citeable:citeable@db:5432/citeable
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
